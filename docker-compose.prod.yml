# Deploy de produção com HTTPS de verdade — Caddy na frente cuida do certificado
# (Let's Encrypt automático) para o domínio em DOMAIN, e faz proxy pro frontend (nginx).
# Só Caddy é exposto nas portas 80/443; frontend/backend/banco ficam na rede interna.
# Uso: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Pré-requisito: o registro DNS de DOMAIN (e www.DOMAIN, se usado) já precisa apontar
# pro IP deste servidor ANTES de subir — é assim que o Let's Encrypt confirma que você
# controla o domínio. Se subir antes do DNS propagar, sem problema: o Caddy fica
# tentando emitir o certificado sozinho em segundo plano até funcionar.

services:
  db:
    image: postgres:16-alpine
    container_name: gestrest-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gestrest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gestrest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gestrest}']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: gestrest-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-gestrest}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gestrest}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # HTTPS de verdade (Caddy na frente) — cookie de refresh só é enviado pelo
      # navegador em conexão segura, e é exatamente isso que temos agora.
      COOKIE_SECURE: 'true'
      # Origem pública usada pelo Socket.IO / CORS.
      CORS_ORIGIN: https://${DOMAIN}
      # fatal | error | warn | info | debug
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/app/uploads
    expose:
      - '4000'

  frontend:
    build: ./frontend
    container_name: gestrest-frontend
    restart: always
    depends_on:
      - backend
    expose:
      - '80'

  # Reverse proxy com TLS automático (Let's Encrypt) — única coisa exposta pro mundo.
  caddy:
    image: caddy:2-alpine
    container_name: gestrest-caddy
    restart: always
    depends_on:
      - frontend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
