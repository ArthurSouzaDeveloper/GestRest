<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b30">
<meta name="robots" content="noindex">
<title>{% block title %}Minha área{% endblock %} · Inspiralle</title>
<link rel="icon" href="{{ url_for('static', filename='icons/icon.svg') }}" type="image/svg+xml">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body class="portal {% block body_class %}{% endblock %}">

<script src="{{ url_for('static', filename='js/portal.js') }}" defer></script>
