services:
  db:
    image: postgres:16-alpine
    container_name: gestrest-db
    environment:
      POSTGRES_USER: gestrest
      POSTGRES_PASSWORD: gestrest
      POSTGRES_DB: gestrest
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gestrest']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: gestrest-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://gestrest:gestrest@db:5432/gestrest?schema=public
      JWT_ACCESS_SECRET: change-me-in-prod-access
      JWT_REFRESH_SECRET: change-me-in-prod-refresh
      # Lista separada por vírgula — mantém o link antigo por IP funcionando junto com o
      # domínio novo (http e https, até o certificado SSL estar configurado no servidor).
      CORS_ORIGIN: http://178.105.238.245:8081,http://gestrest.app.br,https://gestrest.app.br,http://www.gestrest.app.br,https://www.gestrest.app.br
    ports:
      - '4000:4000'
    volumes:
      # Logos enviadas pela tela de Identidade Visual (branding.service.ts) — sem isso, um
      # `docker compose up --build` apaga o container antigo e leva junto qualquer logo que
      # os restaurantes tiverem subido.
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: gestrest-frontend
    depends_on:
      - backend
    ports:
      - '8081:80'

volumes:
  pgdata:
  uploads:
